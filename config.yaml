  hero:
    enable: true
    intro: "Hi, I am"
    title: "Pranav Bhendawade"
    subtitle: "Cloud & Platform Engineer"
    content: "Software Engineer with 5+ years architecting and operating reliable, scalable distributed systems. Expertise in Kubernetes on AWS (EKS) and GCP (GKE), IaC, GitOps, and service mesh networking. Owned services end-to-end: production code, on-call rotations, incident response, and AI-powered operational tooling. Expanding into AI/ML infrastructure — GPU scheduling, vLLM serving, and agentic observability tooling."
    image: /images/me.png
    bottomImage:
      enable: false
    roundImage: true # Make hero image circular | default false
    button:
